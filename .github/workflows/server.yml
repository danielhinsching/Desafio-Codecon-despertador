name: Server CI

on:
  push:
    branches: [main, 'back/**']
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
